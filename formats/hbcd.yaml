format_name: hbcd
description: HBCD (Healthy Brain and Child Development) study data dictionary — 25-column CSV format

input_reader: csv

name_column: name
description_column:
  combine: [header, description]
  separator: " | "
title_column: instruction

type_mapping:
  source_column: type_data
  lookup:
    double:    number
    integer:   integer
    character: string
    text:      string
    date:      date
    time:      time

enum_ordered:
  source_column: type_level
  trigger_values: [ordinal]

section:
  primary_column:  domain
  fallback_column: table_label

levels:
  source_column: levels1
  format: json_array
  value_key: value
  label_key: label
  label_cleaning: strip_outer_quotes

custom_columns:
  - unit
  - metric
  - atlas
  - branching_logic
  - source
  - domain
  - url_table
  - table_name
  - table_label
  - sub_domain

excluded_columns:
  - column: levels2
    reason: Always empty in HBCD — secondary levels column unused.
  - column: type_var
    reason: Internal REDCap variable-type code, redundant with type_data.
  - column: type_field
    reason: Internal REDCap field-type code, redundant with type_data.
  - column: order_display
    reason: Presentation-order hint for HBCD's own display; not a VLMD schema attribute.
  - column: order_sort
    reason: Presentation-order hint for HBCD's own display; not a VLMD schema attribute.
  - column: identifier_columns
    reason: >-
      Lists which columns in the source table act as identifiers.
      Not mapped yet — revisit if we need to expose identifier info in VLMD.
  - column: study
    reason: Constant "HBCD" for every row in this format; carries no per-variable information.
  - column: id
    reason: Internal row/record id, not a data dictionary attribute.

fixup_prompt: prompts/hbcd_fixup_prompt.md
system_invariants_prompt: prompts/system_invariants_vlmd.md

detection:
  signature_columns:
    strong:     [type_level, type_data, levels1]
    supporting: [domain, table_label, atlas, metric, url_table, type_var, type_field]
  confidence_threshold: 0.6
  file_extensions: []
